name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create a GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build zip
        run: |
          ZIP="hostpanel-wireguard-${{ steps.version.outputs.VERSION }}.zip"
          # Include the compiled frontend/main.js only (not src/, package.json, etc.)
          zip -r "$ZIP" plugin/ bin/ service/ sudoers/ \
            --exclude "*/__pycache__/*" --exclude "*.pyc"
          zip "$ZIP" frontend/main.js
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "hostpanel-wireguard v${{ steps.version.outputs.VERSION }}"
          files: ${{ env.ZIP }}
          generate_release_notes: true
